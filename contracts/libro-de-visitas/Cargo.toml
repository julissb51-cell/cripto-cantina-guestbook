[package]
name = "libro-de-visitas"
description = "Libro de visitas de la Cripto Cantina: una firma por dirección"
authors = ["Cripto Cantina"]
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
