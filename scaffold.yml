version: 2

# Cripto Cantina — libro de visitas.
# `stellar scaffold build` y `watch` leen este archivo.
project:
  contracts-dir: contracts
  clients-dir: app-lib/clients
  package-manager: npm@10.9.9

# Elige la red con `--network` o con STELLAR_NETWORK. Sin eso, el default es local.
networks:
  local:
    accounts: [me]

  # Testnet despliega desde este proyecto. La identidad `deployer` se crea y
  # Friendbot la fondea en el primer build.
  testnet:
    accounts: [deployer]
    allow-deploy: true

contracts:
  libro-de-visitas:
    type: workspace
    source: libro-de-visitas
    networks:
      local:
      testnet:
